_target_: src.algorithms.reppo.RePPO
name: reppo

total_timesteps: 2_048_000_000
lr_schedule_timesteps: null # defaults to total_timesteps
N: 32
num_envs_per_policy: 64
num_steps: 1024

learning_rate: 3e-4
anneal_lr: true
lr_anneal: floored # floored: linear decay to 5% at lr_schedule_timesteps/2 | linear: CleanRL decay to 0
gamma: 0.99
gae_lambda: 0.95
num_minibatches: 32
update_epochs: 10
norm_adv: true
clip_coef: 0.2
clip_vloss: true
ent_coef: 0.005
vf_coef: 0.5
max_grad_norm: 0.5
scale_descriptor_returns: false # descriptor rewards x (1 - gamma) for the critics

hidden_dim: 128
logstd_init: 0.0

K_nn: 8
gamma_sq: 0.1
beta_f: 0.99
beta_b: 0.99
C_max: 1.0
eps_f: 1.0
eps_b: 1e-6

repulsion_mode: symmetric # symmetric | higher_only
use_exact_wk: false

force_c_zero: false # true: Independent PPO

eval:
  enabled: true
  every_iters: 25
  num_episodes: 5
checkpoint_every_iters: 100
log_every_iters: 1
